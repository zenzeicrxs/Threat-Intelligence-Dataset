name: Dataset quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - run: python scripts/build_summary.py --check
      - run: python -m unittest discover -s tests -v
      - run: python examples/analyze_summary.py
      - run: python scripts/checksums.py
  empirical-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-verification.txt
      - run: python scripts/verify_empirical.py
      - name: Remove local row-level outputs
        if: always()
        run: rm -rf .local/empirical-verification
